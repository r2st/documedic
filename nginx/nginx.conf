# Reverse proxy for Aether Clinician (production reference).
events {}

http {
  upstream api { server api:8000; }
  upstream web { server web:3000; }

  server {
    listen 80;
    server_name _;

    # Security headers (defense in depth; the API also sets these).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 25m;  # document uploads (API enforces 20 MB)

    # One proxy hop sits in front of the API here, so the API must run with
    # TRUSTED_PROXY_HOPS=1. Without it the application reads the peer address — this
    # container — for every request, and every per-address control collapses onto one key:
    # the login lockout becomes a deployment-wide sign-in block, the signup ceiling becomes a
    # global one, and sessions/audit rows record the proxy instead of the clinician.
    # See apps/api/app/core/client_address.py.
    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://api;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
    }
  }
}
