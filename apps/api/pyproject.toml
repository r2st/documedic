[project]
name = "aether-api"
version = "0.1.0"
description = "Aether Clinician FastAPI backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# The extraction system prompt contains an inline JSON schema example exceeding 100 cols.
"app/services/extraction/claude_client.py" = ["E501"]
# Agent system prompts embed inline JSON output schemas exceeding 100 cols.
"app/agents/prompts.py" = ["E501"]
# Deterministic fallback diagnosis table — aligned single-line tuples read better.
"app/agents/hypothesis_panel.py" = ["E501"]
# Simulated DEMO MODE clinical sample data — long illustrative sentences read better inline.
"app/agents/demo_data.py" = ["E501"]
# ASYNC240 flags blocking pathlib calls inside an async def. Worth enforcing in app/, where a
# blocking unlink() stalls the event loop for every other in-flight request; in tests it only
# ever fires on arrange/assert steps that poke the storage dir directly, with nothing to stall.
"tests/*" = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
# CLAUDE.md specifies mypy strict mode. This was off, which let 17 defs across 8 files go
# unannotated; those are annotated now, so it is on to keep them that way.
disallow_untyped_defs = true

[tool.coverage.run]
# SQLAlchemy async executes inside greenlets; without this, service-layer lines that
# await the DB are under-counted.
concurrency = ["greenlet"]
source = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
